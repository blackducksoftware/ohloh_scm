require: rubocop-performance

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false

Layout/LineLength:
  Max: 99

Style/Documentation:
  Enabled: false

Style/RegexpLiteral:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: false

Metrics/AbcSize:
  Enabled: true
